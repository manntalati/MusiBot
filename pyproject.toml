[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musibot"
version = "0.1.0"
description = "AI drum track generation from drumless songs"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "pretty_midi>=0.2.10",
    "demucs>=4.0",
    "pyfluidsynth>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
app = ["gradio>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
