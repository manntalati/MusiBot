# Learned Automatic Drum Transcription (data/processed/adt clips).
# Trained by scripts/train_adt.py -> runs/adt_best.pt.
batch_size: 64
epochs: 40
lr: 0.0005
weight_decay: 0.01
hidden_dim: 128
n_layers: 2
dropout: 0.1
hit_pos_weight: 2.0     # drum grids are sparse; up-weight hits
# Per-class overrides: hat_open is rare and easily confused with hat_closed, so
# up-weight it to lift its recall (F1 was ~0.39 with the uniform weight).
class_pos_weight:
  hat_open: 5.0
grad_clip: 1.0
seed: 444
device: cuda            # falls back to mps / cpu
patience: 8
window: 64              # steps per training window (4 bars)
num_workers: 4
