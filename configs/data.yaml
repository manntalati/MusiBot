# Data preparation settings.
#
# Every conditional tier now derives its features from *real audio* through the
# same librosa `extract_features` used at inference, so train/inference feature
# distributions match. LMD is the primary source: its non-drum tracks are
# rendered to an in-memory mix (FluidSynth) for features, while the drum grid is
# read straight from the MIDI (ground-truth targets, no transcription). No audio
# is written to disk — set MUSIBOT_SOUNDFONT to a .sf2 (e.g. FluidR3_GM) first.
#
# Rendering all 178k LMD files is unnecessary; cap with `--lmd-limit N` (the
# curation filters in prepare_lmd_rendered already drop junk/duplicates).
#
# GMD is prepared (cheap) for *decoder-only* pretraining via `--sources gmd`;
# its conditioning is positional-only, so don't mix it into conditional training.
datasets:
  gmd: true        # decoder pretraining (don't mix into conditional training)
  lmd: true        # primary conditional supervision (rendered LMD, ground-truth drums)
  musdb18: true    # real-audio anchor (150 songs, if downloaded)
  user_songs: true # fine-tuning tier (your songs)

window_bars: 8
min_bars_per_clip: 8
val_fraction: 0.1
test_fraction: 0.1
seed: 444
